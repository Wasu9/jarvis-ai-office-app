name: Repair final
on: push
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('server/task-runner.ts')
          s = p.read_text()
          bad = "function sleep(ms:number){return new Promise(r=>setTimeout(r,ms));}\\n\\nfunction sourceQuestionReference"
          good = "function sleep(ms:number){return new Promise(r=>setTimeout(r,ms));}\n\nfunction sourceQuestionReference"
          if bad in s:
              s = s.replace(bad, good, 1)
          p.write_text(s)

          p = Path('src/components/FileDropzone.tsx')
          s = p.read_text().replace('await pdf.destroy();', 'await (pdf as any).destroy?.();')
          p.write_text(s)
          PY
          grep -q "function sourceQuestionReference" server/task-runner.ts
          ! grep -Fq '\\n\\nfunction sourceQuestionReference' server/task-runner.ts
          grep -q "destroy?.()" src/components/FileDropzone.tsx
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "JARVIS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/task-runner.ts src/components/FileDropzone.tsx
          git rm -f .github/workflows/repair-final.yml .github/workflows/repair-fidelity.yml .github/workflows/fix-source-fidelity-2.yml 2>/dev/null || true
          git commit -m "fix: finalize source fidelity syntax and PDF upload"
          git push
