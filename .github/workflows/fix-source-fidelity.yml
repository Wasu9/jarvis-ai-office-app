name: Fix source fidelity
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-source-fidelity.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch source fidelity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/task-runner.ts')
          s = p.read_text()
          if "from 'unpdf'" not in s:
              s = s.replace("import { validateExecutionResult, validateTaskRecord } from './core-qa.js';", "import { validateExecutionResult, validateTaskRecord } from './core-qa.js';\nimport { extractText, getDocumentProxy } from 'unpdf';")
          marker = "function sleep(ms:number){return new Promise(r=>setTimeout(r,ms));}"
          helper = r'''\n\nasync function extractAuthoritativePdfText(files?: AttachedFile[]): Promise<string> {\n  const file = files?.find(f => f.base64Data && (f.type?.toLowerCase().includes('pdf') || f.name.toLowerCase().endsWith('.pdf')));\n  if (!file?.base64Data) return '';\n  const raw = String(file.base64Data).replace(/^data:[^;]+;base64,/, '');\n  const bytes = Buffer.from(raw, 'base64');\n  const pdf = await getDocumentProxy(new Uint8Array(bytes));\n  try {\n    const result = await extractText(pdf, { mergePages: false });\n    return Array.isArray(result.text) ? result.text.join('\\n\\n') : String(result.text || '');\n  } finally {\n    try { await pdf.destroy(); } catch {}\n  }\n}\n\nfunction authoritativeQuestionRange(text: string, start: number, end: number): string {\n  if (!text.trim()) return '';\n  const matches = [...text.matchAll(/(?:^|\\n)\\s*(?:Q(?:uestion)?\\s*\\.?\\s*)?(\\d{1,3})[.)]\\s+/gi)];\n  const candidates: Array<{ index: number; length: number }> = [];\n  for (let i = 0; i < matches.length; i++) {\n    if (Number(matches[i][1]) !== 1) continue;\n    let expected = 1, j = i;\n    while (j < matches.length && Number(matches[j][1]) === expected) { expected++; j++; }\n    if (expected > 3) candidates.push({ index: i, length: expected - 1 });\n  }\n  const run = candidates.sort((a,b) => b.length - a.length)[0];\n  if (!run) return '';\n  const byNumber = new Map<number, { start: number; end: number }>();\n  for (let j = run.index; j < run.index + run.length; j++) {\n    const n = Number(matches[j][1]);\n    byNumber.set(n, { start: matches[j].index, end: j + 1 < matches.length ? matches[j + 1].index : text.length });\n  }\n  const first = byNumber.get(start), last = byNumber.get(end);\n  if (!first || !last) return '';\n  return text.slice(first.start, last.end).slice(0, 24000).trim();\n}\n'''
          if 'async function extractAuthoritativePdfText' not in s:
              s = s.replace(marker, marker + helper)
          old = "static async executeLargeSourceTask(params:ExecuteTaskParams,total:number):Promise<TaskRecord>{const started=Date.now();const chunkSize=10;const startFrom=Math.min(total,Math.max(1,Number(params.resumeFrom||1)));let completed=Math.max(0,startFrom-1);let resumeQuestions=Array.isArray(params.resumeQuestions)?[...params.resumeQuestions]:[];let lastTask:TaskRecord|null=null;const allSteps:TaskStep[]=[];"
          new = "static async executeLargeSourceTask(params:ExecuteTaskParams,total:number):Promise<TaskRecord>{const started=Date.now();const chunkSize=10;const startFrom=Math.min(total,Math.max(1,Number(params.resumeFrom||1)));let completed=Math.max(0,startFrom-1);let resumeQuestions=Array.isArray(params.resumeQuestions)?[...params.resumeQuestions]:[];let lastTask:TaskRecord|null=null;const allSteps:TaskStep[]=[];let authoritativeText='';try{authoritativeText=await extractAuthoritativePdfText(params.attachedFiles);if(authoritativeText)dispatchLiveStep({status:'checking',label:'SOURCE TEXT LAYER · PDF text extracted',timestamp:new Date().toISOString(),details:'Using the original PDF text layer as an additional fidelity reference for formulas, symbols, spacing and units.'});}catch(error){console.warn('[Source Fidelity] PDF text extraction unavailable; continuing with visual source input.',error);}"
          if old not in s:
              raise SystemExit('executeLargeSourceTask anchor not found')
          s = s.replace(old, new, 1)
          old2 = "const chunkPrompt=`${params.userPrompt} Process exactly ${total} questions from the attached source. CURRENT CHUNK ONLY: extract Q.${start}–Q.${end}. Do not process questions outside this range.`;"
          new2 = "const sourceReference=authoritativeQuestionRange(authoritativeText,start,end);const chunkPrompt=`${params.userPrompt} Process exactly ${total} questions from the attached source. CURRENT CHUNK ONLY: extract Q.${start}–Q.${end}. Do not process questions outside this range.\n\nAUTHORITATIVE ORIGINAL-PDF TEXT LAYER — USE THIS AS A CHARACTER-LEVEL FIDELITY REFERENCE. It is extracted from the same uploaded PDF, not generated by the model. Recover every mathematical expression, superscript/subscript, vector, Greek letter, fraction, unit, number, punctuation mark and word boundary represented here. If the text layer contains a layout artifact, inspect the attached PDF visually and use the visual source, but NEVER omit an expression simply because OCR/text extraction is inconvenient. Do not solve or simplify formulas.\n<<<SOURCE TEXT Q.${start}–Q.${end}>>>\n${sourceReference}\n<<<END SOURCE TEXT>>>`;"
          if old2 not in s:
              raise SystemExit('chunkPrompt anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)

          p = Path('server/docx-generator.ts')
          s = p.read_text()
          old = "      if (q.sectionName && q.sectionName !== previousSection) {\n        children.push(textParagraph(q.sectionName, { bold: true, size: BODY_SIZE, color: '164E63', align: AlignmentType.CENTER, before: 90, after: 30, keepNext: true }));\n        previousSection = q.sectionName;\n      }\n      children.push(await questionTable(q, i === 0));"
          new = "      if (q.sectionName && q.sectionName !== previousSection) {\n        // Keep section labels attached to the first question of the section. A standalone\n        // heading can be stranded on a page by Word when the following table is cantSplit.\n        const sectionLabel = String(q.sectionName).trim();\n        const sectionPrefix = sectionLabel + '\\n';\n        q.textEn = sectionPrefix + q.textEn;\n        q.textHi = sectionPrefix + (q.textHi || '');\n        previousSection = q.sectionName;\n      }\n      children.push(await questionTable(q, i === 0));"
          if old not in s:
              raise SystemExit('section heading anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify source patch
        run: |
          grep -q "extractAuthoritativePdfText" server/task-runner.ts
          grep -q "AUTHORITATIVE ORIGINAL-PDF TEXT LAYER" server/task-runner.ts
          grep -q "sectionPrefix" server/docx-generator.ts
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "JARVIS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/task-runner.ts server/docx-generator.ts
          git rm .github/workflows/fix-source-fidelity.yml
          git commit -m "fix: preserve source math and prevent section orphan pages"
          git push
