name: Final fidelity repair
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/final-fidelity-repair.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply final repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('server/task-runner.ts')
          s = p.read_text()
          s = s.replace("function sleep(ms:number){return new Promise(r=>setTimeout(r,ms));}\\n\\nfunction sourceQuestionReference", "function sleep(ms:number){return new Promise(r=>setTimeout(r,ms));}\n\nfunction sourceQuestionReference", 1)
          p.write_text(s)

          p = Path('server/docx-generator.ts')
          s = p.read_text()
          old = """      if (q.sectionName && q.sectionName !== previousSection) {
        children.push(textParagraph(q.sectionName, { bold: true, size: BODY_SIZE, color: '164E63', align: AlignmentType.CENTER, before: 90, after: 30, keepNext: true }));
        previousSection = q.sectionName;
      }
"""
          new = """      if (q.sectionName && q.sectionName !== previousSection) {
        // Attach the section label to the first question so Word cannot strand a heading on an empty page.
        const sectionLabel = String(q.sectionName).trim();
        q.textEn = sectionLabel + '\\n' + q.textEn;
        q.textHi = sectionLabel + '\\n' + (q.textHi || '');
        previousSection = q.sectionName;
      }
"""
          if old not in s:
              raise SystemExit('section heading block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify final source
        run: |
          ! grep -Fq '\\n\\nfunction sourceQuestionReference' server/task-runner.ts
          grep -q "function sourceQuestionReference" server/task-runner.ts
          grep -q "AUTHORITATIVE PDF TEXT LAYER" server/task-runner.ts
          grep -q "sectionLabel" server/docx-generator.ts
      - name: Commit and remove all temporary repair workflows
        shell: bash
        run: |
          git config user.name "JARVIS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/task-runner.ts server/docx-generator.ts
          git rm -f .github/workflows/final-fidelity-repair.yml .github/workflows/repair-fidelity.yml .github/workflows/fix-source-fidelity-2.yml 2>/dev/null || true
          git commit -m "fix: finalize source fidelity and section page flow"
          git push
