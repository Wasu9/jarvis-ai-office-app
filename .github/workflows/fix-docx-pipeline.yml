name: Harden DOCX pipeline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic production patch
        run: python .github/scripts/harden_docx.py
      - name: Commit patched production code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/docx-generator.ts server/task-runner.ts
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'fix: harden bilingual DOCX template and source fidelity'
            git push
          fi
