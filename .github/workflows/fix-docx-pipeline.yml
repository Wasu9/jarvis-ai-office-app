name: Harden DOCX pipeline

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-docx-pipeline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch production document pipeline
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          gen = Path('server/docx-generator.ts')
          text = gen.read_text(encoding='utf-8')
          original = text

          # Never expose fake image placeholders in final documents.
          text = re.sub(
              r"function sourceImagePlaceholder\(label:string\):Paragraph \{.*?\n\}",
              "function sourceImagePlaceholder(label:string):Paragraph { return new Paragraph({spacing:{before:0,after:0},children:[]}); }",
              text,
              flags=re.S,
          )
          text = re.sub(
              r"function needsSourceImage\(q:any\):boolean \{.*?\n\}",
              "function needsSourceImage(q:any):boolean { return false; }",
              text,
              flags=re.S,
          )
          text = text.replace(
              "if(!s || /^(?:Graph|ग्राफ|Figure|Fig\\.?|Image|चित्र)\\s*(?:\\(?[1-4A-D]\\)?)?$/i.test(s)) return `[ ORIGINAL PDF IMAGE PLACEHOLDER — OPTION ${label??''} ]`;",
              "if(!s || /^(?:Graph|ग्राफ|Figure|Fig\\.?|Image|चित्र)\\s*(?:\\(?[1-4A-D]\\)?)?$/i.test(s)) return '';",
          )
          text = text.replace('const long=cleaned.some(o=>o.length>42);', 'const long=cleaned.some(o=>o.length>60);')

          # Robustly remove leaked math wrapper tokens if a malformed model response bypasses the rich parser.
          old = "return s.replace(/\\\\times/g,'×').replace(/\\\\cdot/g,'·')"
          if old in text and 'JARVIS_MATH_LEAK_GUARD' not in text:
              text = text.replace(old, "s=s.replace(/\\[\\[MATH:/g,'').replace(/\\]\\]/g,''); /* JARVIS_MATH_LEAK_GUARD */\n  return s.replace(/\\\\times/g,'×').replace(/\\\\cdot/g,'·')", 1)

          # Approved first-page layout: compact exam header, metadata row, syllabus, instructions and student info.
          cover = '''function coverTable(data:DocxPaperData):Table{
  const cell=(children:any[],width:number,fill='FFFFFF',align:any=AlignmentType.LEFT)=>new TableCell({width:{size:width,type:WidthType.PERCENTAGE},shading:{fill,type:ShadingType.CLEAR},borders:THIN_BORDERS,margins:{top:55,bottom:55,left:80,right:80},children});
  const title=new TableRow({cantSplit:true,children:[cell([textParagraph('SHAHEEN',{bold:true,size:22,color:'15803D',align:AlignmentType.CENTER,after:0})],20),cell([textParagraph(String(data.instituteName||'SHAHEEN ACADEMY'),{bold:true,size:28,color:'DC2626',align:AlignmentType.CENTER,after:0}),textParagraph(String(data.title||'BILINGUAL QUESTION PAPER'),{bold:true,size:22,align:AlignmentType.CENTER,after:0})],60),cell([textParagraph('SHAHEEN',{bold:true,size:22,color:'15803D',align:AlignmentType.CENTER,after:0})],20)]});
  const meta=new TableRow({cantSplit:true,children:[cell([textParagraph(`Duration: ${data.duration||'3 Hours'}`,{bold:true,size:20,after:0})],33.33,'F8FAFC'),cell([textParagraph(String(data.medium||'English + हिन्दी'),{bold:true,size:20,align:AlignmentType.CENTER,after:0})],33.34,'F8FAFC'),cell([textParagraph(`Maximum Marks: ${data.totalMarks||''}`,{bold:true,size:20,align:AlignmentType.RIGHT,after:0})],33.33,'F8FAFC')]});
  const syllabus=String(data.syllabus||'').trim();
  const syllabusText=syllabus?`SYLLABUS COVERED\\n${syllabus}`:'SYLLABUS COVERED';
  const syl=new TableRow({cantSplit:true,children:[cell([textParagraph(syllabusText,{bold:false,size:20,after:0})],100,'FFFFFF')]});
  return new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[title,meta,syl],borders:THIN_BORDERS});
}'''
          text = re.sub(r"function coverTable\(data:DocxPaperData\):Table\{.*?\n\}", cover, text, count=1, flags=re.S)

          student = '''function studentInfoTable():Table{
  const row=(a:string,b:string)=>new TableRow({cantSplit:true,children:[makeCell([field(a)],50),makeCell([field(b)],50)]});
  return new Table({width:{size:100,type:WidthType.PERCENTAGE},rows:[
    new TableRow({cantSplit:true,children:[makeCell([textParagraph('STUDENT INFORMATION / छात्र विवरण',{bold:true,size:BODY_SIZE,color:'FFFFFF',align:AlignmentType.CENTER,after:0})],100,'164E63')]}),
    row('Student Name','Roll Number'),row('Class','Batch'),row('Test Date','Mobile Number'),row('Student Signature','Invigilator Signature')
  ],borders:THIN_BORDERS});
}'''
          text = re.sub(r"function studentInfoTable\(\):Table\{.*?\n\}", student, text, count=1, flags=re.S)

          # Remove redundant generic title block before the approved cover table.
          text = re.sub(
              r"export async function generateDocxBuffer\(data:DocxPaperData\):Promise<Buffer>\{const children:Array<Paragraph\|Table>=\[\];const institute=.*?children\.push\(coverTable\(data\)\);",
              "export async function generateDocxBuffer(data:DocxPaperData):Promise<Buffer>{const children:Array<Paragraph|Table>=[];children.push(coverTable(data));",
              text,
              count=1,
              flags=re.S,
          )

          marker='// JARVIS-DOCX-TEMPLATE-HARDENED-2026-09-04'
          if marker not in text:
              text=marker+'\n'+text
          if text!=original:
              gen.write_text(text,encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          p=Path('server/task-runner.ts')
          text=p.read_text(encoding='utf-8')
          original=text
          # Make source extraction explicitly preserve word boundaries, punctuation, math and visual content.
          needle='Read the actual PDF visually and textually. Return exactly'
          replacement='Read the actual PDF visually and textually. Preserve every visible word boundary and space; never concatenate adjacent tokens. Preserve punctuation, decimals, minus signs, fractions, superscripts, subscripts, Greek letters, units and symbols exactly. If OCR text is visually joined, restore the correct spacing from the rendered PDF. Return exactly'
          text=text.replace(needle,replacement)
          # Never let the model emit our old placeholder token as diagram content.
          text=text.replace('populate diagramSvg and sourcePage. Do not solve, correct, summarize, merge, skip or renumber anything.', 'populate diagramSvg with a self-contained SVG whenever a real graph/figure/diagram is visible; never put placeholder text into diagramSvg. Include sourcePage. Do not solve, correct, summarize, merge, skip or renumber anything.')
          marker='// JARVIS-SOURCE-FIDELITY-HARDENED-2026-09-04'
          if marker not in text:
              text=marker+'\n'+text
          if text!=original:
              p.write_text(text,encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/docx-generator.ts server/task-runner.ts
          if git diff --cached --quiet; then
            echo 'No DOCX pipeline changes required.'
          else
            git commit -m 'fix: harden bilingual DOCX template and source fidelity'
            git push
          fi
