name: Fix source fidelity 2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-source-fidelity-2.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair source fidelity helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('server/task-runner.ts')
          s = p.read_text()
          pattern = re.compile(r"function sourceQuestionReference\([\s\S]*?\n\}\n\nfunction normalizeOption", re.M)
          helper = '''function sourceQuestionReference(files: AttachedFile[] | undefined, start: number, end: number): string {
  const source = (files || []).map(f => typeof f.textPreview === 'string' ? f.textPreview : '').filter(Boolean).join('\\n\\n');
  if (!source.trim()) return '';
  const matches = [...source.matchAll(/(?:^|\\n)\\s*(?:Q(?:uestion)?\\s*\\.?\\s*)?(\\d{1,3})[.)]\\s+/gi)];
  let runIndex = -1, runLength = 0;
  for (let i = 0; i < matches.length; i++) {
    if (Number(matches[i][1]) !== 1) continue;
    let expected = 1, j = i;
    while (j < matches.length && Number(matches[j][1]) === expected) { expected++; j++; }
    if (expected - 1 > runLength) { runIndex = i; runLength = expected - 1; }
  }
  if (runIndex < 0) return '';
  const ranges = new Map<number, { start: number; end: number }>();
  for (let j = runIndex; j < runIndex + runLength; j++) {
    const n = Number(matches[j][1]);
    ranges.set(n, { start: matches[j].index, end: j + 1 < matches.length ? matches[j + 1].index : source.length });
  }
  const first = ranges.get(start), last = ranges.get(end);
  return first && last ? source.slice(first.start, last.end).slice(0, 24000).trim() : '';
}

function normalizeOption'''
          s, count = pattern.subn(helper, s, count=1)
          if count != 1: raise SystemExit('sourceQuestionReference block not found')
          p.write_text(s)

          p = Path('src/components/FileDropzone.tsx')
          s = p.read_text()
          s = s.replace('await pdf.destroy();', 'await (pdf as any).destroy?.();')
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q "function sourceQuestionReference" server/task-runner.ts
          grep -q "AUTHORITATIVE PDF TEXT LAYER" server/task-runner.ts
          grep -q "destroy?.()" src/components/FileDropzone.tsx
          ! grep -Fq '\\n\\nfunction sourceQuestionReference' server/task-runner.ts
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "JARVIS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/task-runner.ts src/components/FileDropzone.tsx
          git rm .github/workflows/fix-source-fidelity-2.yml
          git commit -m "fix: repair source fidelity helper and PDF preview typing"
          git push
