name: Finalize DOCX figure placeholders

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[docx-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force placeholders
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/docx-generator.ts')
          s=p.read_text(encoding='utf-8')
          old='if(needsSourceImage(q) && !q.diagramSvg)'
          new='if(needsSourceImage(q))'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
              print('updated')
          else:
              print('already updated')
          PY
      - name: Validate TypeScript
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/docx-generator.ts
          git diff --cached --quiet && exit 0
          git commit -m "Force source PDF image placeholders [docx-final]"
          git push
