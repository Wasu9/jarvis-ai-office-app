name: Fix DOCX type annotation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix type annotation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/docx-generator.ts')
          s=p.read_text(encoding='utf-8')
          s=s.replace('align?: AlignmentType;', 'align?: (typeof AlignmentType)[keyof typeof AlignmentType];')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove runner
        run: |
          rm -f .github/workflows/fix-align-type.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: correct AlignmentType type annotation'
          git push
