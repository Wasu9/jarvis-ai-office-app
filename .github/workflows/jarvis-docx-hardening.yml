name: JARVIS DOCX hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[jarvis-auto-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch DOCX page-break/layout hardening
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/docx-generator.ts')
          s = p.read_text(encoding='utf-8')
          old = """  keepNext?: boolean;\n};"""
          new = """  keepNext?: boolean;\n  pageBreakBefore?: boolean;\n};"""
          if old in s and 'pageBreakBefore?: boolean' not in s:
              s = s.replace(old, new, 1)
          old = """    keepNext: options.keepNext,\n    spacing: { before: options.before ?? 0, after: options.after ?? 35, line: options.hindi ? 260 : 275 },"""
          new = """    keepNext: options.keepNext,\n    pageBreakBefore: options.pageBreakBefore,\n    spacing: { before: options.before ?? 0, after: options.after ?? 35, line: options.hindi ? 260 : 275 },"""
          if old in s and 'pageBreakBefore: options.pageBreakBefore' not in s:
              s = s.replace(old, new, 1)
          old = """  const en: Paragraph[] = [textParagraph(`Q.${q.number}  ${q.textEn}`, { bold: true, size: 24, color: '0F172A', after: 45, keepNext: true })];"""
          new = """  const en: Paragraph[] = [textParagraph(`Q.${q.number}  ${q.textEn}`, { bold: true, size: 24, color: '0F172A', after: 45, keepNext: true, pageBreakBefore: first })];"""
          if old in s:
              s = s.replace(old, new, 1)
          old = """  children.push(new Paragraph({ children: [new PageBreak()] }));\n\n  if (questions.length) {"""
          new = """  if (questions.length) {"""
          if old in s:
              s = s.replace(old, new, 1)
          if 'new PageBreak' not in s:
              s = s.replace('  PageBreak,\n', '', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit hardening patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'jarvis-auto-hardening'
          git config user.email 'actions@users.noreply.github.com'
          git add server/docx-generator.ts
          git commit -m 'Fix DOCX blank page layout [jarvis-auto-hardening]'
          git push
