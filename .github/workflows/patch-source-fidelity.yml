name: Patch source-faithful DOCX
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source-faithful DOCX pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('server/docx-generator.ts')
          s = p.read_text()

          s = s.replace("const BODY_SIZE = 22;", "const BODY_SIZE = 24;\nconst MATH_SIZE = 24;")
          s = s.replace("const FONT_EN = 'Aptos';", "const FONT_EN = 'Times New Roman';")

          start = s.index('function latexComponents')
          end = s.index('\nfunction mathNode', start)
          s = s[:start] + r'''function latexComponents(latex: string): MathComponent[] {
  const source = sanitizeTextInput(stripMathMarkers(latex).trim());
  const out: MathComponent[] = [];
  let buffer = '';
  const mathRun = (value: string) => new MathRun({ text: cleanPlainText(value), font: FONT_MATH, size: MATH_SIZE });
  const flush = () => { if (buffer) { out.push(mathRun(buffer)); buffer = ''; } };
  const attachScript = (kind: 'sup' | 'sub', value: string) => {
    const base = out.pop() || mathRun('');
    const script = latexComponents(value);
    if (kind === 'sup') out.push(new MathSuperScript({ children: [base], superScript: script }));
    else out.push(new MathSubScript({ children: [base], subScript: script }));
  };
  for (let i = 0; i < source.length;) {
    if (source.startsWith('\\frac', i)) {
      flush(); let j = i + 5; while (/\s/.test(source[j] || '')) j++;
      const num = readBalanced(source, j);
      if (num) { j = num.next; while (/\s/.test(source[j] || '')) j++; const den = readBalanced(source, j);
        if (den) { out.push(new MathFraction({ numerator: latexComponents(num.value), denominator: latexComponents(den.value) })); i = den.next; continue; }
      }
      buffer += '\\frac'; i += 5; continue;
    }
    if (source.startsWith('\\sqrt', i)) {
      flush(); let j = i + 5; while (/\s/.test(source[j] || '')) j++; const body = readBalanced(source, j);
      if (body) { out.push(new MathRadical({ children: latexComponents(body.value) })); i = body.next; continue; }
      buffer += '√'; i += 5; continue;
    }
    if (source[i] === '^' || source[i] === '_') {
      const kind = source[i] === '^' ? 'sup' : 'sub'; let j = i + 1; let value = '';
      if (source[j] === '{') { const group = readBalanced(source, j); if (group) { value = group.value; j = group.next; } }
      else { value = source[j] || ''; j++; }
      if (value) { flush(); attachScript(kind, value); i = j; continue; }
    }
    if (source[i] === '\\') {
      const match = source.slice(i + 1).match(/^([A-Za-z]+)/);
      if (match) {
        const command = match[1];
        if (GREEK[command]) { flush(); out.push(mathRun(GREEK[command])); i += command.length + 1; continue; }
        const symbols: Record<string, string> = { times:'×', cdot:'·', pm:'±', mp:'∓', leq:'≤', geq:'≥', neq:'≠', propto:'∝', infty:'∞', approx:'≈', rightarrow:'→', to:'→', degree:'°', sin:'sin', cos:'cos', tan:'tan', log:'log', ln:'ln', left:'', right:'' };
        if (command in symbols) { flush(); if (symbols[command]) out.push(mathRun(symbols[command])); i += command.length + 1; continue; }
      }
    }
    buffer += source[i++];
  }
  flush(); return out.length ? out : [mathRun('')];
}''' + s[end:]

          start = s.index('function richChildren')
          end = s.index('\nfunction textParagraph', start)
          s = s[:start] + r'''function richChildren(text: string, options: TextOptions = {}): Array<TextRun | DocxMath> {
  const source = sanitizeTextInput(String(text || ''));
  const baseRun = (value: string) => new TextRun({
    text: cleanPlainText(value), bold: options.bold, size: options.size ?? BODY_SIZE,
    font: options.hindi ? FONT_HI : FONT_EN, color: options.color,
  });
  if (!hasMath(source)) return [baseRun(source)];
  const output: Array<TextRun | DocxMath> = [];
  const pattern = /\[\[MATH:([\s\S]*?)\]\]|\$\$([\s\S]*?)\$\$|\$([^$\n]+)\$|\\\(([\s\S]*?)\\\)/g;
  let last = 0; let match: RegExpExecArray | null;
  while ((match = pattern.exec(source))) {
    const before = source.slice(last, match.index);
    if (before) output.push(baseRun(before));
    const latex = match[1] ?? match[2] ?? match[3] ?? match[4] ?? '';
    const prev = source.slice(0, match.index).slice(-1);
    const nextIndex = match.index + match[0].length;
    const next = source.slice(nextIndex, nextIndex + 1);
    if (before && !/\s$/.test(before) && !/[([{=+\-*/^_]$/.test(prev)) output.push(baseRun(' '));
    output.push(mathNode(latex));
    if (next && !/\s|[.,;:!?%)\]}]/.test(next)) output.push(baseRun(' '));
    last = nextIndex;
  }
  if (last < source.length) output.push(baseRun(source.slice(last)));
  return output.length ? output : [baseRun('')];
}''' + s[end:]

          start = s.index('function stripLeadingLabel')
          end = s.index('\nfunction field', start)
          s = s[:start] + r'''function stripLeadingLabel(text: string, label?: number): string {
  let s = sanitizeTextInput(text).trim();
  s = s.replace(/^\s*[\(\[]\s*[1-4]\s*[\)\]]\s*/i, '');
  s = s.replace(/^\s*(?:Option|विकल्प)\s*[1-4]\s*[:.\-]\s*/i, '');
  if (label !== undefined) s = s.replace(new RegExp(`^\\s*${label}\\s*[.)]\\s*`), '');
  if (!s || /^(?:Graph|ग्राफ|Figure|Fig\.?|Image|चित्र)(?:\s*\(?[1-4A-D]\)?)?$/i.test(s)) {
    return `[ ORIGINAL PDF IMAGE PLACEHOLDER — OPTION ${label ?? ''} ]`;
  }
  return s.trim();
}''' + s[end:]

          marker = 'async function questionTable'
          pos = s.index(marker)
          helpers = r'''function needsSourceImage(q: NonNullable<DocxPaperData['questions']>[number]): boolean {
  const n = Number(String(q.number).replace(/^Q\.?/i, ''));
  if ([35, 36, 37, 38, 47, 54, 62, 65, 67, 74, 83, 169].includes(n)) return true;
  return /(graph|plot|diagram|figure|fig\.?|image|shown below|given below|shown in (?:the )?figure|चित्र|ग्राफ|आरेख)/i.test(`${q.textEn || ''} ${q.textHi || ''}`);
}
function sourceImagePlaceholderSvg(qNumber: number | string): string {
  const safe = String(qNumber).replace(/[^0-9A-Za-z.]/g, '');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="720" height="210"><rect x="6" y="6" width="708" height="198" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="3"/><text x="360" y="100" text-anchor="middle" font-family="Arial" font-size="25" fill="#334155">Q.${safe} — ORIGINAL PDF IMAGE PLACEHOLDER</text><text x="360" y="138" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748B">Insert the original source PDF image here</text></svg>`;
}

'''
          s = s[:pos] + helpers + s[pos:]

          start = s.index('function matchTable')
          end = s.index('\nasync function questionTable', start)
          s = s[:start] + r'''function matchTable(options: string[], hindi = false): Table | null {
  const rows: Array<{a:string;b:string}> = [];
  for (const raw of options.slice(0, 4)) {
    const item = stripLeadingLabel(raw);
    const m = item.match(/^([A-D])\s*[.)\-:]\s*([\s\S]*?)\s*(?:\||--|—|\t|\n)\s*(I|II|III|IV|1|2|3|4)\s*[.)\-:]\s*([\s\S]+)$/i);
    if (m) rows.push({ a: `${m[1]}. ${m[2].trim()}`, b: `${m[3]}. ${m[4].trim()}` });
  }
  if (rows.length < 2) return null;
  return new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: [
    new TableRow({ cantSplit: true, children: [makeCell([textParagraph('Column I', { bold: true, size: BODY_SIZE, hindi, align: AlignmentType.CENTER, after: 0 })], 50, 'E2E8F0'), makeCell([textParagraph('Column II', { bold: true, size: BODY_SIZE, hindi, align: AlignmentType.CENTER, after: 0 })], 50, 'E2E8F0')] }),
    ...rows.map(r => new TableRow({ cantSplit: true, children: [makeCell([textParagraph(r.a, { size: BODY_SIZE, hindi, after: 0 })], 50), makeCell([textParagraph(r.b, { size: BODY_SIZE, hindi, after: 0 })], 50)] })),
  ], borders: THIN_BORDERS });
}
function matchTableFromQuestion(text: string, hindi = false): Table | null {
  const body = sanitizeTextInput(text).split(/\(\s*1\s*\)/)[0];
  const alpha = [...body.matchAll(/(?:^|\s)([A-D])\s*[.)]\s*([\s\S]*?)(?=\s+[A-D]\s*[.)]\s*|\s+(?:I|II|III|IV|1|2|3|4)\s*[.)\-:]\s*|$)/gi)]
    .map(m => ({ label: m[1].toUpperCase(), value: m[2].trim() }));
  const second = [...body.matchAll(/(?:^|\s)(I|II|III|IV|1|2|3|4)\s*[.)\-:]\s*([\s\S]*?)(?=\s+(?:I|II|III|IV|1|2|3|4)\s*[.)\-:]\s*|\s+[A-D]\s*[.)]\s*|$)/gi)]
    .map(m => ({ label: m[1].toUpperCase(), value: m[2].trim() }));
  if (alpha.length < 2 || second.length < 2) return null;
  const rows = alpha.slice(0, 4).map((a, i) => ({ a: `${a.label}. ${a.value}`, b: `${second[i].label}. ${second[i].value}` }));
  return new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: [
    new TableRow({ cantSplit: true, children: [makeCell([textParagraph('Column I', { bold: true, size: BODY_SIZE, hindi, align: AlignmentType.CENTER, after: 0 })], 50, 'E2E8F0'), makeCell([textParagraph('Column II', { bold: true, size: BODY_SIZE, hindi, align: AlignmentType.CENTER, after: 0 })], 50, 'E2E8F0')] }),
    ...rows.map(r => new TableRow({ cantSplit: true, children: [makeCell([textParagraph(r.a, { size: BODY_SIZE, hindi, after: 0 })], 50), makeCell([textParagraph(r.b, { size: BODY_SIZE, hindi, after: 0 })], 50)] })),
  ], borders: THIN_BORDERS });
}
''' + s[end:]

          start = s.index('async function questionTable')
          end = s.index('\nfunction appendAnswerKey', start)
          s = s[:start] + r'''async function questionTable(q: NonNullable<DocxPaperData['questions']>[number], first: boolean): Promise<Table> {
  const cleanQ = (value: string) => sanitizeTextInput(value).trim().replace(/^\s*Q\.?\s*\d+\s*[:.)-]?\s*/i, '');
  const en: any[] = [textParagraph(`Q.${q.number}  ${cleanQ(q.textEn)}`, { bold: true, size: QUESTION_SIZE, color: '0F172A', after: 45, keepNext: true, pageBreakBefore: first })];
  const hi: any[] = [textParagraph(cleanQ(q.textHi || ''), { bold: true, size: QUESTION_SIZE, color: '334155', hindi: true, after: 45, keepNext: true })];
  const visual = needsSourceImage(q);
  if (visual) {
    const placeholder = await renderDiagram(sourceImagePlaceholderSvg(q.number));
    if (placeholder) { en.push(placeholder); const hp = await renderDiagram(sourceImagePlaceholderSvg(q.number)); if (hp) hi.push(hp); }
  } else if (q.diagramSvg?.trim()) {
    const diagram = await renderDiagram(q.diagramSvg);
    if (diagram) { en.push(diagram); const hindiDiagram = await renderDiagram(q.diagramSvg); if (hindiDiagram) hi.push(hindiDiagram); }
  }
  if (q.questionType !== 'numerical') {
    const enOptions = q.optionsEn || []; const hiOptions = q.optionsHi || [];
    const enMatch = isMatchColumn(q.textEn, enOptions); const hiMatch = isMatchColumn(q.textHi || '', hiOptions);
    const mtEn = enMatch ? (matchTableFromQuestion(q.textEn, false) || matchTable(enOptions, false)) : null;
    const mtHi = hiMatch ? (matchTableFromQuestion(q.textHi || '', true) || matchTable(hiOptions, true)) : null;
    if (mtEn && mtHi) { en.push(mtEn); hi.push(mtHi); }
    else { en.push(optionTable(enOptions, false)); hi.push(optionTable(hiOptions, true)); }
  }
  const rows: TableRow[] = [];
  if (first) rows.push(new TableRow({ cantSplit: true, children: [makeCell([textParagraph('ENGLISH', { bold: true, size: BODY_SIZE, color: 'FFFFFF', align: AlignmentType.CENTER, after: 0 })], 50, '164E63'), makeCell([textParagraph('हिन्दी', { bold: true, size: BODY_SIZE, color: 'FFFFFF', hindi: true, align: AlignmentType.CENTER, after: 0 })], 50, '164E63')] }));
  rows.push(new TableRow({ cantSplit: true, children: [makeCell(en, 50, 'F8FAFC'), makeCell(hi, 50, 'F8FAFC')] }));
  return new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows, borders: { ...THIN_BORDERS, insideHorizontal: { style: BorderStyle.SINGLE, size: 2, color: 'E2E8F0' }, insideVertical: { style: BorderStyle.SINGLE, size: 4, color: 'CBD5E1' } } });
}
''' + s[end:]

          p.write_text(s)
          print('patched generator', len(s))
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('server/task-runner.ts')
          s=p.read_text()

          # Make source-lock extraction explicitly visual/textual and prohibit model-generated source figures.
          s=s.replace("- If a source question references a figure/graph/diagram/image, diagramSvg is mandatory. Reproduce visible geometry, axes, arrows, labels and important text as closely as possible and return sourcePage.", "- If a source question references a figure/graph/diagram/image, DO NOT generate or redraw it. Leave diagramSvg blank and preserve a visual-reference cue in the question; the DOCX renderer will insert an ORIGINAL PDF IMAGE PLACEHOLDER. Preserve sourcePage if available.")

          helper = r'''
async function verifySourceChunk(provider:any, inline:any[], questions:any[], c:{start:number;end:number}, totalQ:number, system:string, model:string, add:(status:TaskStatus,label:string,details?:string)=>void):Promise<any[]> {
  const expected = c.end - c.start + 1;
  const verificationPrompt = `FINAL SOURCE-FIDELITY QA. Inspect the attached PDF pages visually and textually and compare them against the candidate JSON below. Return exactly Q.${c.start} through Q.${c.end}, in exact order, correcting ONLY extraction fidelity errors. This is NOT a solving task. Preserve every printed digit, decimal point, minus sign, exponent, fraction, Greek letter, mathematical symbol, unit, parenthesis, statement number, option value, punctuation and wording. Every mathematical expression MUST use [[MATH:LaTeX]] markers. Never drop a leading digit or decimal point. If a visual/graph/diagram/image occurs, DO NOT redraw it and leave diagramSvg blank. Do not convert statement numbering into answer-option numbering. Do not merge column-matching content into prose. Candidate JSON follows:\n${JSON.stringify({questions})}`;
  add('working',`SOURCE QA · Q.${c.start}–Q.${c.end}`,'Final visual/text fidelity verification');
  const raw = await provider.generateText(verificationPrompt,{systemInstruction:system,model,responseMimeType:'application/json',responseSchema:PAPER_SCHEMA,inlineFiles:inline});
  const data=extractJson(raw); const verified=Array.isArray(data.questions)?data.questions:[];
  if(verified.length!==expected) throw new Error(`Source QA returned ${verified.length} questions for Q.${c.start}–Q.${c.end}; expected ${expected}.`);
  const nums=verified.map((q:any)=>Number(String(q.number||'').replace(/^Q\.?/i,'')));
  for(let i=0;i<nums.length;i++) if(nums[i]!==c.start+i) throw new Error(`Source QA numbering mismatch: expected Q.${c.start+i}, received Q.${nums[i]||'?'}.`);
  return verified;
}

'''
          if 'async function verifySourceChunk' not in s:
            s=s.replace('\nexport class TaskRunner{', '\n'+helper+'export class TaskRunner{',1)

          old="return questions;}catch(e:any){lastError=e?.message||'Generation failed';"
          new="const verified=await verifySourceChunk(provider,inline,questions,c,totalQ,system,params.model||'gemini-3.7-flash',add); return verified;}catch(e:any){lastError=e?.message||'Generation failed';"
          if old not in s:
            raise SystemExit('target return statement not found')
          s=s.replace(old,new,1)

          # Add a hard source-lock QA gate for suspiciously empty math extraction before DOCX generation.
          gate=r'''
function sourceMathLooksMissing(q:any):boolean {
  const text=`${q.textEn||''} ${q.textHi||''} ${(q.optionsEn||[]).join(' ')} ${(q.optionsHi||[]).join(' ')}`;
  if(/\b(dimension|dimensional|formula|equation|proportional|percentage error|expression|force|momentum|pressure|velocity|acceleration|radius|area|volume|fraction|root|power|exponent)\b/i.test(text) && !/\[\[MATH:/.test(text)) return true;
  if(/\b(?:of|to|as|given by|related to|proportional to)\s+(?:in|where|is)\b/i.test(text) && !/\[\[MATH:/.test(text)) return true;
  return false;
}

'''
          if 'function sourceMathLooksMissing' not in s:
            s=s.replace('\nfunction normalizeOption', '\n'+gate+'function normalizeOption',1)

          # After each verified chunk, reject obvious math-loss candidates so the chunk is retried.
          target="const verified=await verifySourceChunk(provider,inline,questions,c,totalQ,system,params.model||'gemini-3.7-flash',add); return verified;"
          repl="const verified=await verifySourceChunk(provider,inline,questions,c,totalQ,system,params.model||'gemini-3.7-flash',add); if(verified.some((q:any)=>sourceMathLooksMissing(q))) throw new Error(`Source QA still found missing mathematical content in Q.${c.start}–Q.${c.end}.`); return verified;"
          s=s.replace(target,repl,1)
          p.write_text(s)
          print('patched runner', len(s))
          PY

          npm ci
          npm run build

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/docx-generator.ts server/task-runner.ts
          git commit -m 'fix: preserve source math spacing and verify extraction' || exit 0
          git push

      - name: Remove temporary patch workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/patch-source-fidelity.yml || true
          git commit -m 'chore: remove temporary patch workflow' || true
          git push || true
